services:

  # Hermes is already running from the main compose — not duplicated here.

  router:
    build: ./router
    container_name: router
    restart: unless-stopped
    env_file: .env
    environment:
      - HERMES_API_URL=http://hermes:8642/v1/chat/completions
      - BRIDGE_URL=http://mt5:8002
      - VISION_MODEL=${VISION_MODEL:-google/gemini-3.1-flash-lite-preview}
      - TEXT_MODEL=${TEXT_MODEL:-deepseek/deepseek-v4-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks: [copier]

  mt5:
    image: gmag11/metatrader5_vnc:2.3
    container_name: mt5
    restart: unless-stopped
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=${VNC_PASSWORD}
      - PUID=1000
      - PGID=1000
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/mt5:/config
      - ./mt5/start.sh:/Metatrader/start.sh:ro
    networks: [copier]

  bridge:
    build: ./bridge
    container_name: bridge
    restart: unless-stopped
    network_mode: "service:mt5"
    env_file: .env
    depends_on: [mt5]
    command: uvicorn bridge:app --host 0.0.0.0 --port 8002

  listener:
    build: ./listener
    container_name: listener
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    depends_on: [router]
    networks: [copier]

networks:
  copier:
    driver: bridge